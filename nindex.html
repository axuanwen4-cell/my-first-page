<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旋哥小游戏</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e3f, #3a1c58, #5a1e8c);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff;
    overflow: hidden;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    margin: 0 0 30px 0;
    text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255, 100, 255, 0.5);
  }
  .wheel-wrap {
    position: relative;
    width: 300px;
    height: 300px;
  }
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 28px solid #ffd700;
    z-index: 10;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
  }
  canvas {
    border-radius: 50%;
    box-shadow: 0 0 0 6px #ffd700, 0 0 30px rgba(255, 215, 0, 0.5);
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  button {
    margin-top: 40px;
    padding: 14px 46px;
    font-size: 18px;
    font-weight: bold;
    color: #3a1c58;
    background: linear-gradient(135deg, #ffe259, #ffa751);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 167, 81, 0.5);
    transition: transform 0.15s ease;
  }
  button:active {
    transform: scale(0.95);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .result {
    margin-top: 25px;
    font-size: 24px;
    font-weight: bold;
    min-height: 36px;
    color: #ffe259;
    text-shadow: 0 0 8px rgba(255, 230, 89, 0.6);
  }
</style>
</head>
<body>

  <h1>旋哥小游戏</h1>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>

  <button id="spinBtn">开始抽取</button>
  <div class="result" id="result"></div>

  <script>
    const options = ["王者荣耀", "金铲铲"];
    const colors = ["#ff6b81", "#4ea1ff"];
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const resultDiv = document.getElementById("result");

    const radius = canvas.width / 2;
    const sliceAngle = 360 / options.length;

    let currentRotation = 0;
    let spinCount = 0;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < options.length; i++) {
        // -90度让第0个扇区从指针（正上方）开始画
        const startAngle = (i * sliceAngle - 90) * Math.PI / 180;
        const endAngle = ((i + 1) * sliceAngle - 90) * Math.PI / 180;

        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate((startAngle + endAngle) / 2);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 22px 'Microsoft YaHei'";
        ctx.fillText(options[i], radius * 0.55, 0);
        ctx.restore();
      }
    }

    drawWheel();

    spinBtn.addEventListener("click", () => {
      spinBtn.disabled = true;
      resultDiv.textContent = "";

      const winnerIndex = Math.floor(Math.random() * options.length);

      // 在中奖扇区内部随机取一个点（两侧各留20%边距），避免停在分界线附近
      const margin = sliceAngle * 0.2;
      const randomInSlice = margin + Math.random() * (sliceAngle - margin * 2);

      // 该扇区（画布坐标系）的起始角度
      const sectorStart = winnerIndex * sliceAngle - 90;
      const targetCanvasAngle = sectorStart + randomInSlice;

      // 需要把 targetCanvasAngle 转到指针所在的正上方（-90°）
      let deltaToTop = (-90 - targetCanvasAngle) % 360;
      if (deltaToTop < 0) deltaToTop += 360;

      spinCount++;
      currentRotation = spinCount * 360 * 8 + deltaToTop;
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        resultDiv.textContent = "🎉 抽中：" + options[winnerIndex];
        spinBtn.disabled = false;
      }, 4100);
    });
  </script>

</body>
</html>
